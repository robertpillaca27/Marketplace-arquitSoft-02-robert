
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ayaPet | Tienda para mascotas</title>

    <!-- Hoja de estilos -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <!-- Encabezado -->
    <header>
        <h1>ayaPet</h1>
        <p>Todo para el cuidado de tus mascotas</p>
    </header>

    <!-- Navegación -->
    <nav>
        <a href="#">Inicioo</a>
        <a href="#catalogo">Productos</a>
        <a href="#administracion">Administración</a>
    </nav>

    <!-- Contenido principal -->
    <main>

        <!-- Catálogo -->
        <section id="catalogo">
            <h2>Nuestros productos</h2>

            <div id="product-list">
                <!-- Aquí mostraremos los productos -->
            </div>
        </section>

        <!-- Administración -->
        <section id="administracion">
            <h2>Administrar productos</h2>

            <button id="btn-new-product">
                Registrar producto
            </button>

            <div id="product-form">
                <!-- Aquí construiremos el formulario -->
            </div>
        </section>

    </main>

    <!-- Pie de página -->
    <footer>
        <p>© 2026 ayaPet - Todos los derechos reservados</p>
    </footer>

    <!-- JavaScript -->
    <script src="/frontend/js/app.js"></script>

</body>
</html>
